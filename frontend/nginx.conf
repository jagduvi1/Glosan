server {
    listen 80;
    server_name _;

    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Säkerhetsheaders i en återanvändbar block. Behöver dupliceras i varje
    # location som har egna add_header-direktiv eftersom nginx-arvet av
    # headers bryts så snart en location lägger till en egen.
    #
    # CSP: scripts + styles bara från egen origin, images tillåter data-URIs
    # (flag-emojis), connect tillåter samma origin + Umami-domänen. Inga
    # inline-scripts; style-src tillåter inline eftersom React injicerar
    # via style={{}}-prop. frame-ancestors 'none' blockar clickjacking.

    # Socket.IO — WebSocket-upgrade behövs för full duplex. Måste komma
    # FÖRE /api/-blocket eftersom nginx väljer mest specifika match.
    location ^~ /api/socket.io/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy all /api/ requests to the Express backend.
    # ^~ ensures this prefix match wins over the static-file regex below.
    location ^~ /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA — fall back to index.html for client-side routing
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.glosan.jeklund.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss: https://analytics.glosan.jeklund.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.glosan.jeklund.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss: https://analytics.glosan.jeklund.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        }
    }

    # Long-lived cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root              /usr/share/nginx/html;
        expires           1y;
        add_header        Cache-Control "public, immutable";
        add_header        X-Content-Type-Options "nosniff" always;
        try_files         $uri =404;
    }
}
