name: CI

# Körs på varje PR och push till main, och som första steg i release.yml —
# inga images byggs förrän allt här är grönt. Jest kan inte ladda MCP-SDK:t
# (ESM), så MCP-transporten och verktygen testas i e2e-jobbet mot en riktig
# stack i Docker.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --ci

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build

  e2e:
    name: End-to-end (Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-not-a-secret
      FRONTEND_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # docker-compose.yml hänger på Traefiks externa nätverk "web".
      - run: docker network create web
      - name: Start the stack
        run: docker compose up --build -d mongo backend frontend
      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - run: npm ci
        working-directory: backend
      - name: MCP e2e
        working-directory: backend
        run: node scripts/mcp-e2e.mjs http://localhost:8080
      - name: Plugga e2e (fas 1)
        working-directory: backend
        run: node scripts/plugga-e2e.mjs http://localhost:8080
      - name: Plugga e2e (fas 2)
        working-directory: backend
        run: node scripts/plugga-fas2-e2e.mjs http://localhost:8080
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend
